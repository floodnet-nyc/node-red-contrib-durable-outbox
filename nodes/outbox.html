<script type="text/javascript">
  RED.nodes.registerType("durable-outbox-config", {
    category: "config",
    defaults: {
      name: { value: "" },
      filename: { value: "/data/outbox/outbox.sqlite", required: true },
      circuitBreakerThreshold: {
        value: 3,
        required: true,
        validate: RED.validators.number()
      },
      circuitBreakerCooldownMs: {
        value: 30000,
        required: true,
        validate: RED.validators.number()
      }
    },
    label: function () {
      return this.name || this.filename || "durable outbox";
    }
  });

  RED.nodes.registerType("outbox-enqueue", {
    category: "storage",
    color: "#C7E9C0",
    defaults: {
      name: { value: "" },
      outbox: { value: "", type: "durable-outbox-config", required: true },
      jobProperty: { value: "outboxJobs", required: true }
    },
    inputs: 1,
    outputs: 1,
    icon: "font-awesome/fa-save",
    label: function () {
      return this.name || "outbox enqueue";
    }
  });

  RED.nodes.registerType("outbox-claim", {
    category: "storage",
    color: "#C7E9C0",
    defaults: {
      name: { value: "" },
      outbox: { value: "", type: "durable-outbox-config", required: true },
      sink: { value: "", required: true },
      intervalMs: { value: 1000, required: true, validate: RED.validators.number() },
      leaseMs: { value: 60000, required: true, validate: RED.validators.number() },
      maxInFlight: { value: 1, required: true, validate: RED.validators.number() }
    },
    inputs: 1,
    outputs: 1,
    icon: "font-awesome/fa-inbox",
    label: function () {
      return this.name || `claim ${this.sink || "outbox"}`;
    }
  });

  RED.nodes.registerType("outbox-settle", {
    category: "storage",
    color: "#C7E9C0",
    defaults: {
      name: { value: "" },
      outbox: { value: "", type: "durable-outbox-config", required: true },
      outcome: { value: "success", required: true }
    },
    inputs: 1,
    outputs: 2,
    outputLabels: ["delivered or retry scheduled", "dead letter"],
    icon: "font-awesome/fa-check-square-o",
    label: function () {
      return this.name || `outbox ${this.outcome}`;
    }
  });

  RED.nodes.registerType("outbox-control", {
    category: "storage",
    color: "#C7E9C0",
    defaults: {
      name: { value: "" },
      outbox: { value: "", type: "durable-outbox-config", required: true },
      action: { value: "status", required: true },
      sink: { value: "" },
      failureClass: { value: "" },
      limit: { value: 100, validate: RED.validators.number() }
    },
    inputs: 1,
    outputs: 1,
    icon: "font-awesome/fa-sliders",
    label: function () {
      return this.name || `outbox ${this.action || "control"}`;
    }
  });
</script>

<script type="text/html" data-template-name="outbox-settle">

<script type="text/html" data-template-name="outbox-control">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name">
  </div>
  <div class="form-row">
    <label for="node-input-outbox"><i class="fa fa-database"></i> Outbox</label>
    <input type="text" id="node-input-outbox">

      <option value="status">Status</option>

      <option value="resume">Resume and drain sink</option>
      <option value="retry-now">Retry pending now</option>

      placeholder="infrastructure or data">

  <div class="form-row">

    <input type="number" id="node-input-limit">
  </div>
</script>

<script type="text/html" data-help-name="durable-outbox-config">
  <p>Owns a durable SQLite outbox database shared by the other outbox nodes.</p>
</script>

<script type="text/html" data-help-name="outbox-enqueue">
  <p>Atomically persists one job or an array of jobs from the configured message property.</p>
  <p>Each job requires <code>sink</code> and <code>payload</code>. Optional policy fields include
  <code>dedupeKey</code>, <code>maxAttempts</code>, <code>maxAgeMs</code>,
  <code>baseDelayMs</code>, <code>maxDelayMs</code>, and
  <code>retryUntilExpired</code>.</p>
</script>

<script type="text/html" data-help-name="outbox-claim">
  <p>Atomically leases the oldest ready job for a sink. It can poll automatically and can also
  be triggered by any input message.</p>
</script>

<script type="text/html" data-help-name="outbox-settle">
  <p>Marks a leased job delivered, schedules a bounded retry, or moves it atomically to the
  dead-letter table. Set <code>msg.outboxFailureClass</code> to
  <code>infrastructure</code> to participate in circuit breaking. The second output receives
  dead-lettered jobs.</p>
</script>

<script type="text/html" data-help-name="outbox-control">
  <p>Provides message-driven operational control over an outbox. Configure an action or select
  <code>msg</code> and set <code>msg.outboxAction</code>.</p>
  <p>Actions are <code>status</code>, <code>pause</code>, <code>resume</code>,
  <code>retry-now</code>, <code>list-dead</code>, <code>requeue-dead</code>, and
  <code>requeue-one</code>. Message properties override configured sink, failure class, limit,
  and dead-letter ID.</p>
</script>
