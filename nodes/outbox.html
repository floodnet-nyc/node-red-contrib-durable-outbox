<script type="text/javascript">
  RED.nodes.registerType("durable-outbox-config", {
    category: "config",
    defaults: {
      name: { value: "" },
      filename: { value: "/data/outbox/outbox.sqlite", required: true },
      maxQueuedJobs: {
        value: 100000,
        required: true,
        validate: RED.validators.number()
      },
      maxJobMb: {
        value: 1,
        required: true,
        validate: RED.validators.number()
      },
      maxEnqueueBatch: {
        value: 1000,
        required: true,
        validate: RED.validators.number()
      },
      maxDatabaseMb: {
        value: 1024,
        required: true,
        validate: RED.validators.number()
      },
      minFreeDiskMb: {
        value: 256,
        required: true,
        validate: RED.validators.number()
      },
      deliveredRetentionMs: {
        value: 86400000,
        required: true,
        validate: function (value) {
          return Number.isFinite(Number(value)) && Number(value) >= 0;
        }
      },
      cleanupIntervalMs: {
        value: 60000,
        required: true,
        validate: function (value) {
          return Number.isFinite(Number(value)) && Number(value) >= 1000;
        }
      },
      cleanupBatchSize: {
        value: 10000,
        required: true,
        validate: function (value) {
          const number = Number(value);
          return Number.isInteger(number) && number >= 1 && number <= 100000;
        }
      },
      cleanupHighWatermarkPercent: {
        value: 80,
        required: true,
        validate: function (value) {
          const number = Number(value);
          return Number.isFinite(number) && number > 0 && number < 100 &&
            number > Number(this.cleanupLowWatermarkPercent);
        }
      },
      cleanupLowWatermarkPercent: {
        value: 70,
        required: true,
        validate: function (value) {
          const number = Number(value);
          return Number.isFinite(number) && number >= 0 &&
            number < Number(this.cleanupHighWatermarkPercent);
        }
      },
      protectIngestion: {
        value: true
      }
    },
    label: function () {
      return this.name || this.filename || "durable outbox";
    }
  });

  RED.nodes.registerType("outbox-sink-config", {
    category: "config",
    defaults: {
      name: { value: "" },
      outbox: { value: "", type: "durable-outbox-config", required: true },
      sinkKey: { value: "", required: true },
      leaseMs: { value: 60000, required: true, validate: RED.validators.number() },
      maxInFlight: { value: 10, required: true, validate: RED.validators.number() },
      batchSize: { value: 10, required: true, validate: RED.validators.number() },
      maxAttempts: { value: 10, required: true, validate: RED.validators.number() },
      retryUntilExpired: { value: "true" },
      maxAgeMs: { value: 86400000, required: true, validate: RED.validators.number() },
      baseDelayMs: { value: 2000, required: true, validate: RED.validators.number() },
      maxDelayMs: { value: 300000, required: true, validate: RED.validators.number() },
      circuitBreakerEnabled: { value: true },
      circuitBreakerThreshold: {
        value: 3,
        required: true,
        validate: RED.validators.number()
      },
      circuitBreakerCooldownMs: {
        value: 30000,
        required: true,
        validate: RED.validators.number()
      }
    },
    oneditprepare: function () {
      const retryUntilExpired =
        this.retryUntilExpired == null ||
        this.retryUntilExpired === true ||
        this.retryUntilExpired === "true";
      $("#node-config-input-retryUntilExpired").val(
        retryUntilExpired ? "true" : "false"
      );

      const updatePolicyVisibility = function () {
        const retryUntilExpired =
          $("#node-config-input-retryUntilExpired").val() === "true";
        const circuitBreakerEnabled =
          $("#node-config-input-circuitBreakerEnabled").prop("checked");

        $(".outbox-sink-max-attempts-row").toggle(!retryUntilExpired);
        $(".outbox-sink-circuit-setting-row").toggle(circuitBreakerEnabled);
      };

      $("#node-config-input-retryUntilExpired")
        .on("change.outboxSink", updatePolicyVisibility);
      $("#node-config-input-circuitBreakerEnabled")
        .on("change.outboxSink", updatePolicyVisibility);
      updatePolicyVisibility();
    },
    oneditsave: function () {
      $("#node-config-input-retryUntilExpired").off(".outboxSink");
      $("#node-config-input-circuitBreakerEnabled").off(".outboxSink");
    },
    oneditcancel: function () {
      $("#node-config-input-retryUntilExpired").off(".outboxSink");
      $("#node-config-input-circuitBreakerEnabled").off(".outboxSink");
    },
    label: function () {
      return this.name || this.sinkKey || "outbox sink";
    }
  });

  RED.nodes.registerType("outbox-enqueue", {
    category: "storage",
    color: "#C7E9C0",
    defaults: {
      name: { value: "" },
      sink: { value: "", type: "outbox-sink-config", required: true },
      payloadProperty: { value: "payload", required: true }
    },
    inputs: 1,
    outputs: 2,
    outputLabels: ["persisted or duplicate", "not persisted"],
    icon: "font-awesome/fa-save",
    oneditprepare: function () {
      $("#node-input-payloadProperty").typedInput({
        types: ["msg"]
      });
    },
    label: function () {
      return this.name || "outbox enqueue";
    }
  });

  RED.nodes.registerType("outbox-claim", {
    category: "storage",
    color: "#C7E9C0",
    defaults: {
      name: { value: "" },
      sink: { value: "", type: "outbox-sink-config", required: true },
      outputMode: { value: "individual", required: true }
    },
    inputs: 1,
    outputs: 1,
    icon: "font-awesome/fa-inbox",
    label: function () {
      return this.name || `claim ${this.sink || "outbox"}`;
    }
  });

  RED.nodes.registerType("outbox-settle", {
    category: "storage",
    color: "#C7E9C0",
    defaults: {
      name: { value: "" },
      sink: { value: "", type: "outbox-sink-config", required: true },
      outcome: { value: "success", required: true }
    },
    inputs: 1,
    outputs: 2,
    outputLabels: ["delivered or retry scheduled", "dead letter"],
    icon: "font-awesome/fa-check-square-o",
    label: function () {
      return this.name || `outbox ${this.outcome}`;
    }
  });

  RED.nodes.registerType("outbox-control", {
    category: "storage",
    color: "#C7E9C0",
    defaults: {
      name: { value: "" },
      action: { value: "status", required: true },
      sink: { value: "", type: "outbox-sink-config", required: true },
      failureClass: { value: "" },
      limit: { value: 100, validate: RED.validators.number() },
      olderThanMs: { value: 86400000, validate: RED.validators.number() }
    },
    inputs: 1,
    outputs: 1,
    icon: "font-awesome/fa-sliders",
    oneditprepare: function () {
      const updateFieldVisibility = function () {
        const action = $("#node-input-action").val();
        const dynamic = action === "msg";
        const deadLetterBulkAction = [
          "list-dead",
          "requeue-dead",
          "delete-dead"
        ].includes(action);

        $(".outbox-control-failure-class-row").toggle(
          dynamic || deadLetterBulkAction
        );
        $(".outbox-control-limit-row").toggle(
          dynamic || deadLetterBulkAction || action === "purge-delivered"
        );
        $(".outbox-control-older-than-row").toggle(
          dynamic || action === "purge-delivered"
        );
      };

      $("#node-input-action")
        .on("change.outboxControl", updateFieldVisibility);
      updateFieldVisibility();
    },
    oneditsave: function () {
      $("#node-input-action").off(".outboxControl");
    },
    oneditcancel: function () {
      $("#node-input-action").off(".outboxControl");
    },
    label: function () {
      return this.name || `outbox ${this.action || "control"}`;
    }
  });
</script>

<script type="text/html" data-help-name="durable-outbox-config">
  <p>Owns a durable SQLite outbox database shared by the other outbox nodes.</p>
  <p>
    Queue depth, job size, enqueue batch, database use, and free-disk limits reject writes
    atomically before SQLite is asked to grow. Database use excludes reusable SQLite pages.
    Minimum free disk reserves headroom for the rest of the system; set it to zero to disable
    that reserve. Capacity failures use distinct error codes such as
    <code>OUTBOX_DATABASE_CAPACITY</code> and <code>OUTBOX_DISK_HEADROOM</code>. Size fields
    use MB, where one MB is 1,048,576 bytes.
  </p>
  <p>
    Delivered history is cleaned automatically in bounded batches. Expired records are
    removed after the configured retention period. When logical database use reaches the
    cleanup-start watermark, the oldest delivered records may be removed early until use
    reaches the cleanup target. Pending, leased, and dead-letter jobs are never removed by
    delivered-history cleanup.
  </p>
</script>

<script type="text/html" data-help-name="outbox-sink-config">
  <p>
    Defines the stable routing key and delivery policy for one logical sink. The selected
    outbox, lease duration, concurrency, claim batch, retry policy, and circuit-breaker policy
    are shared by enqueue, claim, settle, and control nodes. Retry mode controls whether jobs
    stop at the attempt bound or continue until their maximum age. A disabled circuit breaker
    ignores automatic circuit pauses while manual pauses still apply.
  </p>
  <p>
    By default, a poll can lease one complete 10-job batch and retryable failures remain
    active until the 24-hour maximum age. Choose bounded-attempt mode explicitly for sinks
    that should stop after 10 attempts.
  </p>
  <p>
    Jobs persist the <code>Sink key</code>, such as <code>postgres-primary</code>. They never
    persist the generated Node-RED config-node ID, so queue records remain stable when flows
    are exported or reorganized.
  </p>
</script>

<script type="text/html" data-help-name="outbox-enqueue">
  <p>Atomically persists one job from the configured payload property.</p>
  <p>
    By default, the persisted payload is <code>msg.payload</code>. Optional job metadata comes
    from <code>msg.outbox</code>, including <code>dedupeKey</code> or retry overrides. The outbox, stable sink key, and retry
    defaults come from the sink config. A different sink value is rejected. Job IDs are
    generated and managed by the outbox; use <code>dedupeKey</code> for idempotency.
  </p>
  <p>
    An array in <code>msg.payload</code> is one job payload. Use a Split node before enqueue
    when each array element should become an independent job.
  </p>
  <p>
    Plain JSON values, <code>Date</code>, and <code>Buffer</code> values are preserved.
    Undefined object properties are omitted and undefined array entries become null. Circular
    references, functions, streams, and unsupported class instances are rejected atomically.
  </p>
  <p>
    Output 1 contains jobs that were persisted or matched an existing deduplication key.
    Output 2 contains inputs that were not persisted because a storage or queue capacity
    boundary remained after automatic cleanup. Capacity details are written to
    <code>msg.outbox.result</code>. Wire output 2 to an alarm, upstream pause, or another
    durable source-specific recovery path.
  </p>
</script>

<script type="text/html" data-help-name="outbox-claim">
  <p>Each input message atomically leases a bounded batch of the oldest ready jobs for a sink.
  Connect a repeating Inject node to schedule worker polls. Lease duration, claim batch, and
  maximum in-flight capacity come from the selected sink config.</p>
  <p>
    Individual mode emits one message per lease with <code>msg.outbox</code>. Batch mode emits
    one message whose <code>msg.payload</code> is an array of job payloads and whose
    <code>msg.outbox.batch</code> array preserves the corresponding lease metadata. A batch
    message can pass directly through a batch database operation and into
    <code>outbox-settle</code>.
  </p>
  <p>
    Invalid stored payloads are moved to dead letters with failure class
    <code>outbox-corruption</code>, up to ten per poll, so a poison row cannot permanently
    block healthy jobs. An unknown payload encoding pauses the sink instead, because it may
    indicate that a newer writer requires a compatible module version.
  </p>
</script>

<script type="text/html" data-help-name="outbox-settle">
  <p>Marks a leased job for the selected sink delivered, schedules a bounded retry, or moves it
  atomically to the dead-letter table. A mismatched job sink is rejected. The second output
  receives dead-lettered jobs.</p>
  <p>
    Settlement is fenced by the lease token in <code>msg.outbox.leaseToken</code>. A worker
    whose lease expired cannot settle a newer worker's claim; its result is
    <code>stale_lease</code>.
  </p>
  <p>
    The configured outcome is the default. Set
    <code>msg.outbox.retryable</code> to override it: <code>true</code> to retry or
    <code>false</code> to dead-letter. The circuit breaker and failure class
    are derived automatically. Set <code>msg.outbox.circuitFailure</code>,
    <code>msg.outbox.failureClass</code>, or <code>msg.outbox.error</code> to
    override individual derivations.
  </p>
  <p>
    The node also accepts batch claims in <code>msg.outbox.batch</code>. Every lease is settled,
    while one failed batch contributes at most one circuit failure. Results are grouped under
    <code>msg.outbox.result</code> as <code>delivered</code>, <code>retrying</code>,
    <code>dead</code>, and <code>stale</code>.
  </p>
</script>

<script type="text/html" data-help-name="outbox-control">
  <p>
    Provides message-driven operational control over an outbox. Select a fixed action in the
    editor or set <code>msg.outbox.action</code> at runtime with the
    <code>Read msg.outbox.action</code> option. Properties on
    <code>msg.outbox</code> override the configured defaults.
  </p>

  <h3>Inputs</h3>
  <dl class="message-properties">
    <dt>msg.outbox.action <span class="property-type">string</span></dt>
    <dd>
      Overrides the configured action. Required when the editor action is
      <code>Read msg.outbox.action</code>.
    </dd>
    <dt class="optional">msg.outbox.sink <span class="property-type">string</span></dt>
    <dd>
      Overrides the configured sink. Required by <code>pause</code>, <code>resume</code>, and
      <code>retry-now</code>. It is an optional filter for dead-letter actions.
    </dd>
    <dt class="optional">msg.outbox.failureClass <span class="property-type">string</span></dt>
    <dd>
      Overrides the configured failure class. Used by <code>list-dead</code> and
      <code>requeue-dead</code>; typical values are <code>infrastructure</code> and
      <code>data</code>.
    </dd>
    <dt class="optional">msg.outbox.limit <span class="property-type">number</span></dt>
    <dd>
      Overrides the configured maximum number of dead letters to list or requeue. The default
      is 100.
    </dd>
    <dt class="optional">msg.outbox.olderThanMs <span class="property-type">number</span></dt>
    <dd>
      Age threshold for <code>purge-delivered</code>. The default is 86400000 (one day).
    </dd>
    <dt class="optional">msg.outbox.vacuum <span class="property-type">boolean</span></dt>
    <dd>
      Set to true with <code>maintenance</code> to compact the database. Vacuum can block
      ingestion and should be run during a maintenance window.
    </dd>
    <dt class="optional">msg.outbox.checkpoint <span class="property-type">boolean</span></dt>
    <dd>
      Set to false to skip the WAL checkpoint during <code>maintenance</code>.
    </dd>
    <dt class="optional">msg.outbox.sweep <span class="property-type">boolean</span></dt>
    <dd>
      Set to false to skip expiring exhausted jobs during <code>maintenance</code>.
    </dd>
    <dt class="optional">msg.outbox.full <span class="property-type">boolean</span></dt>
    <dd>
      Set to true with <code>check-integrity</code> to run SQLite's full integrity check
      instead of the faster quick check.
    </dd>
    <dt class="optional">msg.outbox.deadLetterId <span class="property-type">string</span></dt>
    <dd>
      Identifies the job for <code>requeue-one</code>.
    </dd>
  </dl>

  <h3>Actions</h3>
  <dl>
    <dt><code>status</code></dt>
    <dd>
      Returns counts grouped by sink and state, the total dead-letter count, and circuit-breaker
      state for each known sink. Health also includes queued count, oldest queued age, expired
      leases, database/WAL bytes, logical database use, reusable bytes, filesystem free space,
      configured capacity reserves, and startup integrity results. It does not require a sink.
    </dd>

    <dt><code>pause</code></dt>
    <dd>
      Manually pauses claims for the selected sink. Existing pending and delivered records are
      unchanged. A currently leased delivery is not cancelled.
    </dd>

    <dt><code>resume</code></dt>
    <dd>
      Clears the selected sink's manual pause and open circuit, resets its consecutive-failure
      count, and makes all pending jobs for that sink immediately eligible. Use this after
      confirming that PostgreSQL or another sink has recovered.
    </dd>

    <dt><code>retry-now</code></dt>
    <dd>
      Makes all pending jobs for the selected sink immediately eligible, without clearing a
      manual pause or open circuit. Claims will still wait until the sink is resumed or its
      circuit cooldown expires.
    </dd>

    <dt><code>list-dead</code></dt>
    <dd>
      Returns dead-letter jobs for the selected or message-overridden sink, optionally filtered
      by failure class, up to <code>limit</code>. This action does not modify the queue.
    </dd>

    <dt><code>requeue-dead</code></dt>
    <dd>
      Atomically moves matching dead letters back to the pending queue and resets their attempt
      count. Jobs are restricted to the selected or message-overridden sink and may also be
      filtered by failure class.
    </dd>

    <dt><code>requeue-one</code></dt>
    <dd>
      Atomically moves one reviewed dead letter back to the pending queue. It requires a job ID
      in <code>msg.outbox.deadLetterId</code>.
    </dd>

    <dt><code>delete-dead</code></dt>
    <dd>
      Permanently deletes a bounded number of dead letters matching the selected or
      message-overridden sink and optional failure-class filter. This cannot be undone; review
      with <code>list-dead</code> first.
    </dd>

    <dt><code>purge-delivered</code></dt>
    <dd>
      Deletes at most <code>limit</code> delivered records whose delivery time is at least
      <code>olderThanMs</code> old. Pending and leased jobs are never affected.
    </dd>

    <dt><code>maintenance</code></dt>
    <dd>
      Expires attempt-exhausted and age-expired jobs across all sinks, then checkpoints the
      SQLite WAL. Unlike the sweep performed while claiming, this runs even for paused or
      circuit-open sinks, so expiry does not depend on a claim node polling. Set
      <code>msg.outbox.sweep = false</code> to skip the expiry pass, or
      <code>msg.outbox.vacuum = true</code> to compact the main database after retention cleanup;
      schedule vacuum during a quiet maintenance window.
    </dd>

    <dt><code>check-integrity</code></dt>
    <dd>
      Checks required tables and triggers, compares tracked queue counts with active jobs, and
      runs SQLite's quick integrity check. It returns <code>ok: false</code> with detailed
      errors if bookkeeping or database integrity is inconsistent.
    </dd>
  </dl>

  <h3>Outputs</h3>
  <p>
    The input message is preserved. The action result is written to <code>msg.payload</code>
    and to <code>msg.outbox.result</code>.
  </p>
  <pre>{
  "outbox": {
    "result": {
      "action": "resume",
      "sink": "postgres-demo",
      "result": {
        "released": 17
      }
    }
  }
}</pre>

  <h3>Dynamic example</h3>
  <pre>msg.outbox.action = "requeue-dead";
msg.outbox.sink = "postgres-demo";
msg.outbox.failureClass = "infrastructure";
msg.outbox.limit = 1000;
return msg;</pre>

  <p>
    Invalid actions and missing required properties raise a Node-RED error and can be handled
    with a Catch node.
  </p>
</script>
